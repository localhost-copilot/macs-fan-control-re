name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture and release version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Test
        run: swift test
      - name: Build and verify signed app
        run: bash scripts/build-app.sh
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Macs Fan Control Swift.app" "release/Macs-Fan-Control-$ARCH.zip"
          cd release
          shasum -a 256 "Macs-Fan-Control-$ARCH.zip" > "Macs-Fan-Control-$ARCH.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macs-fan-control-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macs-fan-control-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "Macs Fan Control $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
